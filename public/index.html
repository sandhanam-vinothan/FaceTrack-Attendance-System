<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1c2b"><title>FaceAttend – Student Attendance</title>
<style>
:root{--a:#5eead4;--t:#e8f1f8;--m:#8fa6b8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t);background:radial-gradient(800px 500px at 0 -10%,#14607a66,transparent),radial-gradient(700px 500px at 100% 0,#5b3a9a55,transparent),#07101a;background-attachment:fixed}
#app{max-width:980px;margin:0 auto;padding:12px 14px 40px}
.g{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;margin:12px 0}
header.g{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}header b span,h1 b{color:var(--a)}
h1,h2,h3{margin:0 0 10px}h3{font-size:16px}.mu{color:var(--m);font-size:13px}
input,select,button{font:inherit;color:var(--t);border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);padding:9px 12px;min-width:0}
select option{color:#000}input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
button{cursor:pointer;background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:0;font-weight:600;color:#04121a}
button.s{background:rgba(255,255,255,.1);color:var(--t);border:1px solid rgba(255,255,255,.18)}button.s.on{background:var(--a);color:#04121a}
button:disabled{opacity:.5;cursor:not-allowed}
.box{max-width:380px;margin:12vh auto}.box form{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 130px}label.mu{display:grid;gap:2px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:middle}th{color:var(--m);font-weight:500;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:10px}.tiles div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px;font-size:12px;color:var(--m)}.tiles b{display:block;font-size:22px;color:var(--t)}
.p{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent;background:rgba(255,255,255,.08);color:var(--t)}
button.p{margin:2px;opacity:.75}button.p.on{opacity:1;border-color:#fff}
.PRESENT{background:#16a34a;color:#fff}.ABSENT{background:#dc2626;color:#fff}.OD{background:#2563eb;color:#fff}.LATE{background:#d97706;color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;background:#0b2233;border:1px solid var(--a);border-radius:14px;padding:12px 16px;z-index:20}
#md:not(:empty){position:fixed;inset:0;display:grid;place-items:center;background:#000a;z-index:10;padding:14px}.mc{max-width:560px;width:100%;max-height:90vh;overflow:auto;background:#0d1d2b}
a{color:var(--a);cursor:pointer}

:root{--bg:#f4f8ff;--panel:rgba(255,255,255,.72);--panel2:#fff;--t:#172033;--m:#6e7b91;--line:rgba(38,58,93,.12);--a:#63d8cc;--b:#7ca7ff;--c:#c6a7ff;--danger:#ef6f78;--shadow:0 20px 55px rgba(53,75,115,.12)}
[data-theme="dark"]{--bg:#09111f;--panel:rgba(20,30,49,.76);--panel2:#111b2c;--t:#edf5ff;--m:#9aabc3;--line:rgba(255,255,255,.1);--a:#65e0d4;--b:#80aaff;--c:#c9adff;--shadow:0 24px 60px rgba(0,0,0,.28)}
body{color:var(--t);background:radial-gradient(900px 600px at -10% -10%,rgba(99,216,204,.22),transparent 60%),radial-gradient(850px 600px at 110% 0,rgba(198,167,255,.25),transparent 58%),var(--bg);transition:.35s ease;color-scheme:light}html[data-theme="dark"] body{color-scheme:dark}#app{max-width:1240px;padding:22px 24px 90px}.g{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
header.g{position:sticky;top:12px;z-index:8;padding:13px 18px}.brand{display:flex;align-items:center;gap:10px;font-size:18px}.brandmark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b),var(--c));box-shadow:0 8px 25px rgba(124,167,255,.28)}.brandmark svg{width:22px;height:22px;color:#102038}.headRight{display:flex;align-items:center;gap:10px}.liveclock{min-width:190px;text-align:right}.liveclock b{display:block;font-size:22px;letter-spacing:.04em}.liveclock small{color:var(--m)}
nav{padding:10px 2px;position:sticky;top:84px;z-index:7;background:linear-gradient(var(--bg) 65%,transparent)}nav button{display:flex;align-items:center;gap:7px}.icon{width:17px;height:17px;display:inline-block;vertical-align:-3px}button{background:linear-gradient(135deg,var(--a),#78c8ff);transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(85,165,220,.2)}button.s{background:var(--panel);color:var(--t);border:1px solid var(--line)}button.s.on{background:linear-gradient(135deg,var(--a),#9ed6ff);color:#102038}.danger{background:rgba(239,111,120,.12)!important;color:var(--danger)!important;border:1px solid rgba(239,111,120,.25)!important}
input,select{background:var(--panel2);color:var(--t);border:1px solid var(--line)}.tiles div{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line)}th,td{border-color:var(--line)}
.loginPage{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:28px;background:linear-gradient(120deg,rgba(8,23,42,.74),rgba(34,29,72,.72)),radial-gradient(circle at 20% 20%,#63d8cc 0 2px,transparent 3px),linear-gradient(135deg,#10283a,#242248);background-size:auto,34px 34px,auto}.loginPage:before,.loginPage:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);animation:float 7s ease-in-out infinite}.loginPage:before{width:340px;height:340px;left:8%;top:10%;background:linear-gradient(135deg,#72e3d555,#7ca7ff44)}.loginPage:after{width:260px;height:260px;right:9%;bottom:10%;background:linear-gradient(135deg,#c6a7ff55,#7ca7ff44);animation-delay:-2s}.loginCard{position:relative;z-index:1;width:min(430px,94vw);padding:34px!important;background:rgba(255,255,255,.12)!important;color:#f7fbff!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:0 35px 90px rgba(0,0,0,.28)!important;animation:rise .7s cubic-bezier(.2,.8,.2,1)}.loginCard .mu{color:#c6d3e2}.loginCard input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2);padding:13px 14px}.loginCard input::placeholder{color:#b8c5d5}.pwWrap{position:relative}.pwWrap input{width:100%;padding-right:48px}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent!important;color:#d9e8f8!important;padding:7px!important;box-shadow:none!important}.eye:hover{transform:translateY(-50%) scale(1.08)}
.aiFab{position:fixed;right:24px;bottom:24px;width:62px;height:62px;border-radius:50%;z-index:40;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b),var(--c));box-shadow:0 18px 45px rgba(82,129,214,.38);animation:pulse 2.8s infinite}.aiFab svg{width:28px;height:28px}.aiPanel{position:fixed;right:24px;bottom:98px;width:min(390px,calc(100vw - 32px));height:520px;max-height:70vh;z-index:39;background:var(--panel2);border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}.aiHead{padding:14px 16px;background:linear-gradient(135deg,rgba(99,216,204,.18),rgba(198,167,255,.18));display:flex;justify-content:space-between}.aiMsgs{flex:1;overflow:auto;padding:14px}.msg{max-width:86%;padding:10px 12px;border-radius:16px;margin:8px 0;white-space:pre-wrap}.msg.me{margin-left:auto;background:linear-gradient(135deg,var(--a),#9dd9ff);color:#102038}.msg.ai{background:var(--panel);border:1px solid var(--line)}.aiInput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.aiInput input{flex:1}.hidden{display:none!important}.dangerZone{border-color:rgba(239,111,120,.25);background:linear-gradient(145deg,var(--panel),rgba(239,111,120,.06))}.datepill{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(124,167,255,.13);font-size:12px;font-weight:700}.scanHero{background:linear-gradient(135deg,rgba(99,216,204,.14),rgba(124,167,255,.12),rgba(198,167,255,.14))}
@keyframes float{50%{transform:translateY(24px) translateX(12px)}}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}@keyframes pulse{0%,100%{box-shadow:0 18px 45px rgba(82,129,214,.35),0 0 0 0 rgba(99,216,204,.25)}50%{box-shadow:0 18px 45px rgba(82,129,214,.35),0 0 0 14px rgba(99,216,204,0)}}
@media(max-width:700px){#app{padding:12px 12px 90px}.liveclock{min-width:0}.liveclock b{font-size:16px}.liveclock small{display:none}header.g{top:6px}.headRight .userlabel{display:none}nav{top:72px}.aiFab{right:16px;bottom:16px}.aiPanel{right:16px;bottom:88px}.g{border-radius:19px}}
</style></head><body><div id="app"></div><div id="md"></div><div id="toast" hidden></div>
<script>
const $=q=>document.querySelector(q),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const IC={home:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',cal:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></svg>',cam:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',sun:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',bot:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 13h.01M16 13h.01M8 17h8"/></svg>'};
let THEME=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=THEME;
const nextDate=day=>{const d=new Date(),js=d.getDay()||7,add=(day-js+7)%7,n=new Date(d);n.setDate(d.getDate()+add);return n.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})};
function toggleTheme(){THEME=THEME==='dark'?'light':'dark';localStorage.setItem('theme',THEME);document.documentElement.dataset.theme=THEME}
function tick(){const n=new Date(),a=$('#clockTime'),b=$('#clockDate');if(a)a.textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});if(b)b.textContent=n.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}setInterval(tick,1000);
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'],ST=['PRESENT','ABSENT','OD','LATE'],VIEWS={};
let T=localStorage.getItem('t'),U=null,TAB='',D={};
const toast=(m,ms=4000)=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,ms)};
async function api(m,u,b){const r=await fetch('/api/'+u,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+(T||'')},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&T&&u!=='login')logout();throw j}return j}
const fail=x=>toast('⚠️ '+(x&&x.error||'Network error. Try again.'));
function logout(){T=null;U=null;localStorage.removeItem('t');boot()}
const fd=f=>Object.fromEntries(new FormData(f)),nm=(a,id)=>(a.find(x=>x.id==id)||{}).name||'-';
const opts=a=>a.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('');
const tbl=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mu">Nothing here yet.</td></tr>`}</table></div>`;
const modal=h=>{$('#md').innerHTML=`<div class="g mc">${h}<button onclick="$('#md').innerHTML=''">Close</button></div>`};
const rep=r=>`<div class="tiles"><div><b>${r.pct}%</b>Attendance</div><div><b>${r.present}</b>Present</div><div><b>${r.absent}</b>Absent</div><div><b>${r.od}</b>OD</div><div><b>${r.late}</b>Late</div></div><p class="mu">Present, Late and OD count as attended.</p>`+tbl(['Date','Period','Status'],r.history.map(h=>[h.date,h.period,`<span class="p ${h.st}">${h.st}</span>`]));
async function boot(){if(!T)return login();try{U=(await api('GET','me')).user}catch{return login()}U.must?pwForm():shell()}
function login(){$('#app').innerHTML=`<div class="loginPage"><div class="g loginCard"><div class="brand" style="font-size:26px;margin-bottom:8px"><span class="brandmark">${IC.cam}</span><b>Face<span style="color:var(--a)">Attend</span></b></div><p class="mu">Smart face attendance • secure college access</p><form onsubmit="doLogin(this);return false"><input name="email" type="email" placeholder="Email address" required autocomplete="username"><div class="pwWrap"><input id="loginPw" name="password" type="password" placeholder="Password" required autocomplete="current-password"><button type="button" class="eye" aria-label="Show password" onclick="togglePw('loginPw',this)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button>Sign in</button></form><p class="mu">Accounts are managed by your administrator.</p></div></div>`}
function togglePw(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.setAttribute('aria-label',x.type==='password'?'Show password':'Hide password')}
async function doLogin(f){try{const r=await api('POST','login',fd(f));T=r.token;localStorage.setItem('t',T);boot()}catch(x){fail(x)}return false}
function pwForm(){$('#app').innerHTML=`<div class="g box"><h2>Set a new password</h2><p class="mu">You must change your temporary password before continuing.</p><form onsubmit="doPw(this);return false"><input name="old" type="password" placeholder="Current password" required><input name="new" type="password" placeholder="New password (8+ chars, letter and number)" required minlength="8"><button>Save password</button></form><p><a onclick="logout()">Log out</a></p></div>`}
async function doPw(f){try{await api('POST','password',fd(f));toast('Password saved');boot()}catch(x){fail(x)}return false}
const TABS={admin:['Manage'],teacher:['Classes','Timetable','Attendance','Classroom Scanner'],student:['My attendance']};
function shell(){if(!TABS[U.role].includes(TAB))TAB=TABS[U.role][0];
 $('#app').innerHTML=`<header class="g"><div class="brand"><span class="brandmark">${IC.cam}</span><b>Face<span style="color:var(--a)">Attend</span></b></div><div class="liveclock"><b id="clockTime">--:--:--</b><small id="clockDate"></small></div><div class="headRight"><span class="mu userlabel">${e(U.name)} · ${U.role}</span><button class="s" onclick="toggleTheme()">${IC.sun}</button><button class="s" onclick="logout()">Log out</button></div></header><nav>${TABS[U.role].map(t=>`<button class="s ${t==TAB?'on':''}" onclick="TAB='${t}';shell()">${t==='Timetable'?IC.cal:t==='Classroom Scanner'?IC.cam:IC.home}${t}</button>`).join('')}</nav><main id="main">Loading…</main><button class="aiFab" title="FaceAttend AI" onclick="toggleAI()">${IC.bot}</button><section id="aiPanel" class="aiPanel hidden"><div class="aiHead"><b>FaceAttend AI</b><button class="s" onclick="toggleAI()">×</button></div><div id="aiMsgs" class="aiMsgs"><div class="msg ai">Hi ${e(U.name)}. Ask me about FaceAttend or any general question.</div></div><form class="aiInput" onsubmit="askAI(this);return false"><input name="q" placeholder="Ask anything…" autocomplete="off"><button>Send</button></form></section>`;tick();VIEWS[TAB]().catch(fail)}
function toggleAI(){$('#aiPanel')?.classList.toggle('hidden')}
async function askAI(f){const q=f.q.value.trim();if(!q)return;const m=$('#aiMsgs');m.insertAdjacentHTML('beforeend',`<div class="msg me">${e(q)}</div><div class="msg ai" id="thinking">Thinking…</div>`);f.reset();m.scrollTop=m.scrollHeight;try{const r=await api('POST','ai',{question:q});$('#thinking').id='';m.lastElementChild.textContent=r.answer}catch(x){$('#thinking').id='';m.lastElementChild.textContent=x.error||'AI is unavailable.'}m.scrollTop=m.scrollHeight}
/* ---- Admin ---- */
const fld=([n,l,t])=>t==='number'?`<input name="${n}" type="number" min="1" max="12" placeholder="${l}" required>`:t==='time'?`<label class="mu">${l}<input name="${n}" type="time" required></label>`:t==='days'?`<select name="${n}">${DAYS.map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select>`:t?`<select name="${n}" required><option value="">${l}…</option>${opts(D[t])}</select>`:`<input name="${n}" placeholder="${l}" required>`;
const FORMS=[['dept','department',[['name','Name']]],['class','class',[['name','Class name, e.g. Information Technology – A'],['deptId','Department','depts'],['semester','Semester','number']]],['teacher','teacher',[['name','Name'],['email','Email']]],['student','student',[['name','Name'],['email','Email'],['collegeId','College ID'],['regNo','Registration no.'],['classId','Class','classes']]],['assign','teacher–class assignment',[['teacherId','Teacher','teachers'],['classId','Class','classes']]],['tt','timetable entry',[['classId','Class','classes'],['teacherId','Teacher','teachers'],['subject','Subject'],['day','Day','days'],['period','Period','number'],['start','Start','time'],['end','End','time']]]];
VIEWS.Manage=async()=>{D=await api('GET','admin/data');
 $('#main').innerHTML=FORMS.map(([k,t,fs])=>`<form class="g" onsubmit="add(this,'${k}');return false"><h3>Add ${t}</h3><div class="row">${fs.map(fld).join('')}<button>Add</button></div></form>`).join('')+
 `<div class="g"><h3>Classes</h3>${tbl(['Class','Department','Sem'],D.classes.map(c=>[e(c.name),e(nm(D.depts,c.deptId)),c.semester+` <button class="s danger" onclick="delAdmin('class',${c.id})">Remove</button>`]))}</div>
 <div class="g"><h3>Teachers</h3>${tbl(['Name','Email','Assigned classes'],D.teachers.map(t=>[e(t.name),e(t.email),e(D.assigns.filter(a=>a.tid==t.id).map(a=>nm(D.classes,a.cid)).join(', ')||'-')+` <button class="s danger" onclick="delAdmin('teacher',${t.id})">Remove</button>`]))}</div>
 <div class="g"><h3>Students</h3>${tbl(['Name','College ID','Reg. no.','Class'],D.students.map(s=>[e(s.name),e(s.collegeId),e(s.regNo),e(nm(D.classes,s.classId))+` <button class="s danger" onclick="delAdmin('student',${s.id})">Remove</button>`]))}</div>
 <div class="g"><h3>Timetable</h3>${tbl(['Class','Teacher','Subject','Day','Period','Time'],D.tt.map(t=>[e(nm(D.classes,t.cid)),e(nm(D.teachers,t.tid)),e(t.subject),DAYS[t.day-1],t.period,t.start+'–'+t.end+` <button class="s danger" onclick="delAdmin('timetable',${t.id})">Remove</button>`]))}</div><div class="g dangerZone"><h3>Data controls</h3><p class="mu">Clear attendance sessions, marks and correction history while keeping departments, classes, teachers, students and timetable.</p><button class="s danger" onclick="clearAttendance()">Clear attendance history</button></div>`};
async function add(f,k){try{const r=await api('POST','admin/'+k,fd(f));toast(r.temp?`Account created. Temporary password: ${r.temp} (shown once – share it securely)`:'Added ✓',r.temp?30000:3000);VIEWS.Manage()}catch(x){fail(x)}return false}
async function delAdmin(type,id){if(!confirm('Remove this '+type+'? Related records may also be removed.'))return;try{await api('POST','admin/delete',{type,id});toast('Removed');VIEWS.Manage()}catch(x){fail(x)}}
async function clearAttendance(){if(!confirm('Clear ALL attendance sessions, marks and correction history? This cannot be undone.'))return;try{await api('POST','admin/clear-attendance',{});toast('Attendance history cleared');VIEWS.Manage()}catch(x){fail(x)}}
/* ---- Teacher ---- */
VIEWS.Classes=async()=>{const c=await api('GET','t/classes');$('#main').innerHTML=`<div class="g"><h3>My classes</h3>${tbl(['Class','Sem',''],c.map(x=>[e(x.name),x.semester,`<button class="s" onclick="ros(${x.id})">Roster</button>`]))}</div><div id="ro"></div>`};
async function ros(id){try{const r=await api('GET','t/roster/'+id);$('#ro').innerHTML=`<div class="g"><h3>Student roster</h3>${tbl(['Name','College ID','Reg. no.',''],r.map(s=>[e(s.name),e(s.collegeId),e(s.regNo),`<button class="s" onclick="srep(${s.id})">Report</button>`]))}</div>`}catch(x){fail(x)}}
async function srep(id){try{const r=await api('GET','t/student/'+id);modal(`<h3>${e(r.name)}</h3>`+rep(r))}catch(x){fail(x)}}
VIEWS.Timetable=async()=>{const t=await api('GET','t/tt');$('#main').innerHTML=`<div class="g"><h3>${IC.cal} My timetable</h3><p class="mu">Dates show the next occurrence of each weekly timetable slot.</p>${tbl(['Date','Day','Period','Time','Class','Subject'],t.map(x=>[`<span class="datepill">${nextDate(x.day)}</span>`,DAYS[x.day-1],x.period,x.start+'–'+x.end,e(x.className),e(x.subject)]))}</div>`};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
VIEWS.Attendance=async()=>{const[c,s]=await Promise.all([api('GET','t/classes'),api('GET','t/sessions')]);
 $('#main').innerHTML=`<form class="g" onsubmit="mkS(this);return false"><h3>New attendance session</h3><div class="row"><select name="classId" required><option value="">Class…</option>${opts(c)}</select><input name="date" type="date" value="${today()}" required><input name="period" type="number" min="1" max="12" placeholder="Period" required><button>Create session</button></div></form><div class="g"><h3>My sessions</h3>${tbl(['Class','Date','Period','Status',''],s.map(x=>[e(x.className),x.date,x.period,x.closed?'Closed':'Open',`<button class="s" onclick="openS(${x.id})">Open</button> <button class="s danger" onclick="deleteSession(${x.id})">Remove</button>`]))}</div><div id="ss"></div>`};
async function mkS(f){try{const r=await api('POST','t/session',fd(f));await VIEWS.Attendance();openS(r.id)}catch(x){fail(x)}return false}
async function openS(id){try{const r=await api('GET','t/session/'+id),s=r.session,m=r.summary;window.RO=r.roster;
 $('#ss').innerHTML=`<div class="g"><h3>${e(s.className)} – ${s.date}, period ${s.period} ${s.closed?'(closed)':''}</h3><div class="tiles"><div><b>${m.total}</b>Students</div><div><b>${m.present}</b>Present</div><div><b>${m.absent}</b>Absent</div><div><b>${m.od}</b>OD</div><div><b>${m.late}</b>Late</div><div><b>${m.unmarked}</b>Unmarked</div><div><b>${m.pct}%</b>Attendance</div></div>`+
 tbl(['Student','College ID','Status','Face'],r.roster.map(x=>[`<a onclick="srep(${x.id})">${e(x.name)}</a>`,e(x.collegeId),ST.map(k=>`<button class="p ${k} ${x.st===k?'on':''}" ${s.closed?'disabled':''} onclick="mark(${id},${x.id},'${k}','${x.st||''}')">${k}</button>`).join(''),(x.face?'✅ ':'')+`<a onclick="enrol(${id},${x.id})">${x.face?'Re-enrol':'Enrol'}</a>`]))+
 `<div class="row" style="margin-top:10px">${s.closed?'':`<button onclick="closeS(${id})">Close session</button>`}${s.closed?'':`<button class="s" onclick="scan(${id})">📷 Face scan</button>`}</div></div>`+
 (r.fixes.length?`<div class="g"><h3>Correction history</h3>${tbl(['Student','Change','Reason','By','When'],r.fixes.map(x=>[e(x.student),`${x.prev} → ${x.next}`,e(x.reason),e(x.by),new Date(x.at).toLocaleString()]))}</div>`:'');
 $('#ss').scrollIntoView({behavior:'smooth'})}catch(x){fail(x)}}
async function mark(sid,stu,st,cur){if(cur===st)return;let reason;if(cur){reason=prompt('Reason for correcting '+cur+' → '+st+'?');if(!reason)return}
 try{await api('POST','t/mark',{sessionId:sid,studentId:stu,status:st,reason});openS(sid)}catch(x){fail(x)}}
async function closeS(id){if(!confirm('Close this session? Attendance can no longer be changed.'))return;try{await api('POST','t/close/'+id);await VIEWS.Attendance();openS(id)}catch(x){fail(x)}}
async function deleteSession(id){if(!confirm('Remove this attendance session and its marks/history?'))return;try{await api('POST','t/delete-session/'+id);toast('Session removed');VIEWS.Attendance()}catch(x){fail(x)}}
/* ---- TEST MODE: unlocked classroom wall scanner ---- */
let WALL_RUNNING=false,WALL_SID=null,WALL_SLOT=null;
async function ensurePeriodSession(x){
 const ss=await api('GET','t/sessions'),date=today();
 let s=ss.find(q=>String(q.date).slice(0,10)===date&&+q.period===+x.period&&+q.cid===+x.cid);
 if(!s)s=await api('POST','t/session',{classId:x.cid,date,period:x.period});
 return s;
}
VIEWS['Classroom Scanner']=async()=>{
 WALL_RUNNING=false;WALL_SID=null;WALL_SLOT=null;
 const tt=await api('GET','t/tt');
 $('#main').innerHTML=`<div class="g"><h3>📷 Classroom Wall Scanner</h3><p class="mu">Choose an allocated timetable period and start the classroom wall camera. Scanner access is currently unrestricted by time, as configured.</p><div class="w"><table><thead><tr><th>Date</th><th>Day</th><th>Period</th><th>Time</th><th>Class</th><th>Subject</th><th></th></tr></thead><tbody>${tt.map((x,i)=>`<tr><td><span class="datepill">${nextDate(x.day)}</span></td><td>${DAYS[x.day-1]}</td><td>${x.period}</td><td>${x.start}–${x.end}</td><td>${e(x.className)}</td><td>${e(x.subject)}</td><td><button onclick="startTestScanner(${i})">📷 Open scanner</button></td></tr>`).join('')}</tbody></table></div>${tt.length?'':'<p class="mu">No timetable entries are assigned to this teacher yet.</p>'}</div>`;
 window.WALL_TT=tt;
};
async function startTestScanner(i){
 if(WALL_RUNNING)return;
 try{const x=(window.WALL_TT||[])[i];if(!x)throw{error:'Timetable period not found.'};const s=await ensurePeriodSession(x);if(s.closed)throw{error:'This attendance session is already closed. Create/use another period for testing.'};WALL_RUNNING=true;WALL_SID=s.id;WALL_SLOT=x;await wallScan(s.id,x)}catch(z){WALL_RUNNING=false;WALL_SID=null;WALL_SLOT=null;fail(z)}
}
async function wallScan(sid,slot){try{toast('Loading camera and face models…',8000);await loadFace();const r=await api('GET','t/session/'+sid),F=await api('GET','t/faces/'+r.session.cid);
 if(!F.length){WALL_RUNNING=false;return toast('No faces enrolled for this class yet. Enrol the student from Attendance first.',6000)}
 const stt={},nm={};r.roster.forEach(x=>{stt[x.id]=x.st;nm[x.id]=x.name});
 const M=new faceapi.FaceMatcher(F.map(f=>new faceapi.LabeledFaceDescriptors(String(f.id),f.d.map(d=>new Float32Array(d)))),.5);
 const c=await cam('CLASSROOM SCANNER — '+e(r.session.className),`<div style="text-align:center"><div style="font-size:13px;font-weight:800;color:var(--a)">SCANNER READY</div><div style="font-size:20px;font-weight:800;margin-top:5px">${e(slot.subject)}</div><div style="font-size:16px">${DAYS[slot.day-1]} · Period ${r.session.period} · ${slot.start}–${slot.end}</div><div id="clock" class="mu" style="font-size:16px;margin:4px 0 12px"></div><div id="wallmsg" style="font-size:26px;font-weight:800;color:var(--a);min-height:42px">Show face to camera</div><p id="wallsub" class="mu">Looking for enrolled students…</p><div class="tiles"><div><b id="wallcount">${Object.values(stt).filter(x=>x==='PRESENT').length}</b>Present</div><div><b>${r.roster.length}</b>Students</div></div><p class="mu">Camera stays active until you press Stop camera.</p><div class="row"><button class="s" id="cx">Stop camera</button></div></div>`);
 const clock=()=>{const q=c.q('#clock');if(q)q.textContent=new Date().toLocaleString()};clock();const ci=setInterval(clock,1000);const oldStop=c.stop;c.stop=()=>{clearInterval(ci);WALL_RUNNING=false;WALL_SID=null;WALL_SLOT=null;oldStop()};
 c.q('#cx').onclick=()=>{c.stop();VIEWS['Classroom Scanner']()};let seen={},busy=0,last='';
 c.t=setInterval(async()=>{if(busy||c.dead)return;busy=1;try{const ds=await faceapi.detectAllFaces(c.v,FO()).withFaceLandmarks().withFaceDescriptors(),cur=new Set();if(!ds.length)c.q('#wallsub').textContent='Waiting for a face…';
  for(const d of ds){const m=M.findBestMatch(d.descriptor);if(m.label==='unknown')continue;const id=+m.label;if(!id)continue;cur.add(id);seen[id]=(seen[id]||0)+1;if(seen[id]<2)continue;
   if(stt[id]){if(last!==id){c.q('#wallmsg').textContent='Already recorded — '+nm[id];c.q('#wallsub').textContent=stt[id];last=id}continue}
   await api('POST','t/mark',{sessionId:sid,studentId:id,status:'PRESENT'});stt[id]='PRESENT';last=id;c.q('#wallmsg').textContent='✓ '+nm[id];c.q('#wallsub').textContent='ATTENDANCE RECORDED';c.q('#wallcount').textContent=Object.values(stt).filter(x=>x==='PRESENT').length}
  for(const k in seen)if(!cur.has(+k))delete seen[k]
 }catch(z){if(z&&z.error){fail(z);c.stop();return}}busy=0},800)
}catch(x){WALL_RUNNING=false;WALL_SID=null;WALL_SLOT=null;ferr(x)}}

/* ---- Face scan ---- */
const FV='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12',FO=()=>new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5});let FL;
const wait=ms=>new Promise(z=>setTimeout(z,ms));
const ferr=x=>fail(x&&x.error?x:{error:x&&x.name==='NotAllowedError'?'Camera permission was denied.':(x&&x.message)||'Camera error.'});
const loadFace=()=>FL||(FL=(async()=>{if(!window.faceapi)await new Promise((ok,no)=>{const s=document.createElement('script');s.src=FV+'/dist/face-api.js';s.onload=ok;s.onerror=()=>no({error:'Could not load the face library. Check your internet connection.'});document.head.appendChild(s)});faceapi.tf&&await faceapi.tf.ready();await Promise.all([faceapi.nets.tinyFaceDetector,faceapi.nets.faceLandmark68Net,faceapi.nets.faceRecognitionNet].map(n=>n.loadFromUri(FV+'/model/')))})().catch(x=>{FL=null;throw x}));
async function cam(title,html){if(!navigator.mediaDevices)throw{error:'Camera needs http://localhost or HTTPS.'};const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
 const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;overflow:auto;padding:16px';
 d.innerHTML=`<div class="g" style="max-width:700px;margin:auto"><h3>${title}</h3><video autoplay muted playsinline style="width:100%;border-radius:12px;background:#000;transform:scaleX(-1)"></video>${html}</div>`;document.body.appendChild(d);
 const v=d.querySelector('video');v.srcObject=st;const o={d,v,q:s=>d.querySelector(s),stop(){clearInterval(o.t);o.dead=1;st.getTracks().forEach(t=>t.stop());d.remove()}};return o}
async function enrol(sid,id){const s=RO.find(x=>x.id===id);try{toast('Loading camera and face models…',8000);await loadFace();
 const c=await cam('Enrol face – '+e(s.name),'<p class="mu">Ask the student to look straight at the camera in good light.</p><div class="row"><button id="cap">Capture 3 photos</button><button class="s" id="cx">Cancel</button></div>');
 c.q('#cx').onclick=c.stop;c.q('#cap').onclick=async()=>{const b=c.q('#cap');b.disabled=true;const ds=[];
  try{for(let i=0;i<3&&!c.dead;i++){let r;for(let k=0;k<8&&!r&&!c.dead;k++){r=await faceapi.detectSingleFace(c.v,FO()).withFaceLandmarks().withFaceDescriptor();if(!r)await wait(400)}
   if(!r){if(!c.dead){toast('No face found. Try again.');b.disabled=false}return}
   ds.push(Array.from(r.descriptor,n=>+n.toFixed(4)));toast('Photo '+(i+1)+' of 3 captured');await wait(700)}
   await api('POST','t/face',{studentId:id,descriptors:ds});toast('✅ Face enrolled: '+s.name);c.stop();openS(sid)}catch(x){ferr(x);b.disabled=false}}}catch(x){ferr(x)}}
async function scan(sid){try{toast('Loading camera and face models…',8000);await loadFace();const r=await api('GET','t/session/'+sid),F=await api('GET','t/faces/'+r.session.cid);
 if(!F.length)return toast('No faces enrolled yet. Click Enrol next to each student first.',6000);
 const stt={},nm={},done=[];r.roster.forEach(x=>{stt[x.id]=x.st;nm[x.id]=x.name});
 const M=new faceapi.FaceMatcher(F.map(f=>new faceapi.LabeledFaceDescriptors(String(f.id),f.d.map(d=>new Float32Array(d)))),.5);
 const c=await cam('Face scan – '+e(r.session.className),'<p id="sl" class="mu">Looking for enrolled students…</p><div class="row"><button class="s" id="cx">Done</button></div>');
 c.q('#cx').onclick=()=>{c.stop();openS(sid)};let seen={},busy=0;
 c.t=setInterval(async()=>{if(busy||c.dead)return;busy=1;try{const ds=await faceapi.detectAllFaces(c.v,FO()).withFaceLandmarks().withFaceDescriptors(),cur=new Set();
  for(const d of ds){const m=M.findBestMatch(d.descriptor),id=+m.label;if(!id||stt[id])continue;cur.add(id);seen[id]=(seen[id]||0)+1;if(seen[id]<2)continue;
   await api('POST','t/mark',{sessionId:sid,studentId:id,status:'PRESENT'});stt[id]='PRESENT';done.push(nm[id]);c.q('#sl').innerHTML='✅ Marked present ('+done.length+'): '+done.map(e).join(', ')}
  for(const k in seen)if(!cur.has(+k))delete seen[k]}catch(x){if(x&&x.error){fail(x);c.stop();openS(sid);return}}busy=0},800)}catch(x){ferr(x)}}
/* ---- Student ---- */
VIEWS['My attendance']=async()=>{const r=await api('GET','s/report');$('#main').innerHTML=`<div class="g"><h3>My attendance</h3>${rep(r)}</div>`};
boot();
</script></body></html>
